server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Proxy API + auth + health to the api service so the web origin and API
  # origin match — keeps better-auth session cookies same-site without CORS.
  location /api/ {
    proxy_pass         http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }
  location = /health {
    proxy_pass         http://api:3001/health;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
  }

  location / {
    try_files $uri /index.html;
  }

  location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|webp|ico)$ {
    expires 7d;
    access_log off;
  }
}
